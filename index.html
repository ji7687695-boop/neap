<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>neap</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header><button class="icon">‹</button><button class="icon">▦</button><button id="mode" class="mode">日常？ 🫨 <b>›</b></button><button class="icon">↗</button><button class="icon">♡</button></header><div class="liveDot"></div><main id="feed"></main><button id="fab">＋</button><nav><button class="active">⌂<span>Home</span></button><button>♡<span>通知</span></button><button>○<span>Me</span></button></nav></div><div id="modal" class="hidden"><section class="sheet"><button id="close">×</button><h2>今なにしてる？</h2><button id="openCamera" type="button" class="photo">📷 撮影する</button><label class="libraryPicker"><input id="photo" type="file" accept="image/*"><span>写真から選ぶ</span></label><div id="photoPreviewWrap" class="previewWrap hidden"><img id="photoPreview" class="preview"><button id="removePhoto" type="button" class="removePhoto">×</button></div><textarea id="text" placeholder="ひとこと"></textarea><input id="tag" placeholder="趣味・目的（例：映画、野球、飲み）"><button id="post">投稿</button></section></div><div id="cameraLayer" class="cameraLayer hidden"><video id="cameraVideo" autoplay playsinline muted></video><canvas id="cameraCanvas" class="hidden"></canvas><button id="cameraClose" class="cameraClose">×</button><button id="cameraFlip" class="cameraFlip">↻</button><button id="cameraShot" class="cameraShot" aria-label="撮影"></button></div><script src="app.js?v=7"></script></body></html>
